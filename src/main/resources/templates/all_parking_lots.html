<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Available Parking Lots</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f3fff3;
            font-family: Arial, sans-serif;
        }

        .page-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .page-header h1 {
            color: #3a7f3a;
            font-weight: bold;
        }

        .card {
            border: 1px solid #b2d8b2;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #3a7f3a;
            box-shadow: 0 6px 20px rgba(58, 127, 58, 0.2);
            transform: translateY(-5px);
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            color: #2f5f2f;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .container {
            max-width: 1300px;
        }

        .card-action-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-action-btn {
            opacity: 1;
        }

        .card-wrapper {
            position: relative;
        }

        .modal-bill-display {
            background-color: #e8f5e9;
            border-left: 4px solid #3a7f3a;
            padding: 15px;
            border-radius: 6px;
        }

        .bill-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #2f5f2f;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <!-- Top Bar -->
    <div class="top-bar">
        <div>
            <a href="#" class="btn btn-outline-success"
               data-bs-toggle="modal" data-bs-target="#locationModal">
                <i class="bi bi-geo-alt-fill"></i> My Location
            </a>
        </div>
        <div>
            <a href="/login" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div class="page-header">
        <h1>Available Parking Lots</h1>
    </div>

    <!-- Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Sort + My Bills -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <label for="sortSelect" class="form-label fw-bold">Sort by:</label>
            <select id="sortSelect" class="form-select" style="width: 200px;">
                <option value="name" th:selected="${currentSort == 'name'}">Name</option>
                <option value="nearest" th:selected="${currentSort == 'nearest'}">Nearest</option>
                <option value="availability" th:selected="${currentSort == 'availability'}">Availability</option>
                <option value="pricing" th:selected="${currentSort == 'pricing'}">Pricing</option>
            </select>
        </div>

        <div>
            <a href="/my-bills" class="btn btn-info">
                <i class="bi bi-file-earmark-text"></i> My Bills
            </a>
        </div>
    </div>

    <!-- Parking cards -->
    <div class="row g-4 justify-content-center">
        <div class="col-md-5 col-lg-4" th:each="lot : ${parkingLots}">
            <div class="card shadow-sm card-wrapper"
                 data-bs-toggle="modal"
                 data-bs-target="#billModal"
                 th:data-lot-id="${lot.id}"
                 th:data-lot-name="${lot.name}"
                 th:data-lot-price="${lot.price}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${lot.name}">Parking Name</h5>

                    <p class="card-text">
                        <a th:href="${lot.location}" target="_blank"
                           th:text="${lot.location}"
                           onclick="event.stopPropagation()">Location</a><br>

                        <span th:if="${lot.distance != null}"
                              class="badge bg-info text-dark">
                            Distance:
                            <span th:text="${#numbers.formatDecimal(lot.distance,1,1)}">0.0</span> km
                        </span><br>

                        <strong>Total spots:</strong>
                        <span th:text="${lot.spots}">0</span><br>

                        <span th:classappend="${lot.freeSpots == 0} ? 'text-danger' : ''">
                        <strong>Free spots:</strong>&nbsp;<span th:text="${lot.freeSpots}">0</span>
                        </span><br>

                        <strong>Price:</strong>
                        RON <span th:text="${lot.price}">0.00</span>/hr
                    </p>

                    <div class="card-action-btn">
                        <i class="bi bi-calculator-fill" style="font-size: 1.5rem; color: #3a7f3a;"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Location Modal -->
<div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header" style="background-color:#f3fff3;">
                <h5 class="modal-title" style="color:#2f5f2f;">
                    <i class="bi bi-geo-alt-fill"></i> My Location
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div id="locationStatus"></div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Latitude:</label>
                    <input type="text" class="form-control" id="currentLat" readonly placeholder="Not set">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Longitude:</label>
                    <input type="text" class="form-control" id="currentLon" readonly placeholder="Not set">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Estimated Address:</label>
                    <textarea class="form-control" id="locationAddress" rows="2" readonly
                              placeholder="Address will appear here"></textarea>
                </div>

                <div class="d-grid">
                    <button type="button" class="btn btn-success" id="getLocationBtn">
                        <i class="bi bi-crosshair"></i> Get My Current Location
                    </button>
                </div>

            </div>

            <div class="modal-footer" style="background-color:#f3fff3;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Bill Calculator Modal -->
<div class="modal fade" id="billModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header" style="background-color:#f3fff3;">
                <h5 class="modal-title" style="color:#2f5f2f;">
                    <i class="bi bi-calculator-fill"></i> Calculate Parking Bill
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label fw-bold">Parking Lot:</label>
                    <div class="alert alert-light border">
                        <strong id="billLotName">-</strong>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Price per Hour:</label>
                    <div class="alert alert-light border">
                        RON <span id="billPrice">0.00</span>/hr
                    </div>
                </div>

                <hr>

                <div class="mb-3">
                    <label for="dateTimeInput" class="form-label fw-bold">
                        <i class="bi bi-calendar-event"></i> Date and Time Parked:
                    </label>
                    <input type="datetime-local"
                           id="dateTimeInput"
                           class="form-control form-control-lg"
                           required>
                </div>

                <div class="mb-3">
                    <label for="hoursInput" class="form-label fw-bold">
                        <i class="bi bi-clock"></i> Hours Spent at Parking:
                    </label>
                    <input type="number"
                           id="hoursInput"
                           class="form-control form-control-lg"
                           min="0"
                           max="999"
                           step="1"
                           value="0"
                           placeholder="Enter hours">
                </div>

                <hr>

                <div class="modal-bill-display">
                    <div class="text-center">
                        <p class="mb-2" style="color: #666;">Total Amount Due:</p>
                        <div class="bill-amount">RON <span id="totalBill">0.00</span></div>
                    </div>
                </div>

            </div>

            <div class="modal-footer" style="background-color:#f3fff3;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
                <button type="button" class="btn btn-success" id="confirmBillBtn">
                    <i class="bi bi-check-circle"></i> Confirm & Save
                </button>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script src="/js/ajax-utils.js"></script>

<script>
    /**
     * ========================================
     * PARKING LOTS PAGE - REAL-TIME UPDATES
     * ========================================
     */

    let userLocation = { lat: null, lon: null };
    let currentBill = {
        lotId: null,
        lotName: null,
        lotPrice: null,
        hours: 0,
        totalAmount: 0,
        dateTime: null
    };
    let billModalInstance = null;

    /**
     * Update parking lots cards by fetching data and re-rendering
     */
    async function updateParkingLots() {
        const sort = document.getElementById('sortSelect').value;
        const lat = localStorage.getItem('userLat');
        const lon = localStorage.getItem('userLon');

        // Validate "nearest" requires location
        if (sort === 'nearest') {
            if (!lat || !lon) {
                showErrorMessage('Please set your location first to use nearest sorting.');
                document.getElementById('sortSelect').value = 'name';
                return;
            }
        }

        // Fetch parking lots data from API
        const data = await fetchData('/api/parking-lots', {
            sort: sort,
            userLat: lat || null,
            userLon: lon || null
        });

        if (!data) {
            showErrorMessage('Failed to load parking lots. Please try again.');
            return;
        }

        // Get the container for parking lot cards
        const cardsContainer = document.querySelector('.row.g-4');

        // Clear existing cards
        cardsContainer.innerHTML = '';

        // Add each parking lot as a card
        data.parkingLots.forEach(lot => {
            const col = document.createElement('div');
            col.className = 'col-md-5 col-lg-4';

            // Build distance badge if available
            const distanceBadge = lot.distance
                ? `<span class="badge bg-info text-dark">Distance: ${lot.distance.toFixed(1)} km</span><br>`
                : '';

            // Build free spots indicator (red if 0)
            const freeSpotClass = lot.freeSpots === 0 ? 'text-danger' : '';

            col.innerHTML = `
                <div class="card shadow-sm card-wrapper"
                     data-bs-toggle="modal"
                     data-bs-target="#billModal"
                     data-lot-id="${lot.id}"
                     data-lot-name="${escapeHtml(lot.name)}"
                     data-lot-price="${lot.price}">
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(lot.name)}</h5>
                        <p class="card-text">
                            <a href="${escapeHtml(lot.location)}" target="_blank"
                               onclick="event.stopPropagation()">
                                ${escapeHtml(lot.location)}
                            </a><br>
                            ${distanceBadge}
                            <strong>Total spots:</strong> ${lot.spots}<br>
                            <span class="${freeSpotClass}">
                                <strong>Free spots:</strong> ${lot.freeSpots}
                            </span><br>
                            <strong>Price:</strong> RON ${parseFloat(lot.price).toFixed(2)}/hr
                        </p>
                        <div class="card-action-btn">
                            <i class="bi bi-calculator-fill" style="font-size: 1.5rem; color: #3a7f3a;"></i>
                        </div>
                    </div>
                </div>
            `;

            cardsContainer.appendChild(col);
        });

        // Re-attach bill modal listeners to newly created cards
        attachBillModalListeners();
    }

    /**
     * Escape HTML special characters for security
     */
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    /**
     * Attach event listeners to bill modal and parking lot cards
     */
    function attachBillModalListeners() {
        const billModal = document.getElementById('billModal');

        billModal.addEventListener('show.bs.modal', function(event) {
            const card = event.relatedTarget;

            const lotId = card.getAttribute('data-lot-id');
            const lotName = card.getAttribute('data-lot-name');
            const lotPrice = card.getAttribute('data-lot-price');

            currentBill.lotId = lotId;
            currentBill.lotName = lotName;
            currentBill.lotPrice = parseFloat(lotPrice);

            document.getElementById('billLotName').textContent = lotName;
            document.getElementById('billPrice').textContent = parseFloat(lotPrice).toFixed(2);

            document.getElementById('hoursInput').value = '0';
            calculateBill();
        });
    }

    /**
     * Calculate the total bill amount
     */
    function calculateBill() {
        const hours = parseInt(document.getElementById('hoursInput').value) || 0;
        const price = currentBill.lotPrice;
        const total = (hours * price).toFixed(2);

        currentBill.hours = hours;
        currentBill.totalAmount = parseFloat(total);

        document.getElementById('totalBill').textContent = total;
    }

    /**
     * Save bill to database
     */
    async function saveBill() {
        const dateTimeInput = document.getElementById('dateTimeInput').value;

        if (!dateTimeInput) {
            showErrorMessage('Please select a date and time.');
            return;
        }

        // Validate date is not in the future
        const selectedDateTime = new Date(dateTimeInput);
        const now = new Date();

        if (selectedDateTime > now) {
            showErrorMessage('Cannot create a bill with a future date. Please select a date and time in the past.');
            return;
        }

        if (currentBill.hours === 0) {
            showErrorMessage('Please enter the number of hours spent at this parking lot.');
            return;
        }

        // Convert datetime-local to ISO 8601 format
        const dateTimeISO = dateTimeInput + ':00';

        const billingData = {
            parkingLotId: currentBill.lotId,
            moneyAmount: currentBill.totalAmount,
            timeSpent: currentBill.hours,
            dateIssued: dateTimeISO
        };

        try {
            const response = await fetch('/save-bill', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(billingData)
            });

            if (response.ok) {
                showSuccessMessage('Bill successfully saved!');
                bootstrap.Modal.getInstance(document.getElementById('billModal')).hide();
            } else {
                const errorText = await response.text();
                showErrorMessage(errorText || 'Failed to save bill.');
            }
        } catch (error) {
            console.error('Error:', error);
            showErrorMessage('Failed to connect to the server.');
        }
    }

    /**
     * Initialize page on load
     */
    document.addEventListener('DOMContentLoaded', function() {
        // Set default date-time to now
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('dateTimeInput').value = `${year}-${month}-${day}T${hours}:${minutes}`;

        // Load saved location if exists
        const lat = localStorage.getItem('userLat');
        const lon = localStorage.getItem('userLon');

        if (lat && lon) {
            updateLocationDisplay(parseFloat(lat), parseFloat(lon));
        }

        // Sort dropdown listener
        document.getElementById('sortSelect').addEventListener('change', function() {
            updateParkingLots();
        });

        // Get Location button listener
        document.getElementById('getLocationBtn').addEventListener('click', function() {
            getLocationAndUpdate();
        });

        // Date/Time input listener
        document.getElementById('dateTimeInput').addEventListener('change', function() {
            if (this.value) {
                currentBill.dateTime = this.value;
            }
        });

        // Hours input listener
        document.getElementById('hoursInput').addEventListener('input', function() {
            let value = this.value;

            // Remove non-digit characters
            value = value.replace(/[^\d]/g, '');

            let intValue = parseInt(value) || 0;

            // Cap at 999
            if (intValue > 999) {
                intValue = 0;
            }

            this.value = intValue;
            calculateBill();
        });

        // Confirm Bill button listener
        document.getElementById('confirmBillBtn').addEventListener('click', function() {
            saveBill();
        });

        // Attach bill modal listeners
        attachBillModalListeners();

        startAutoRefresh();
    });

    /**
     * Get user location and update display
     */
    function getLocationAndUpdate() {
        const status = document.getElementById('locationStatus');

        if (!navigator.geolocation) {
            status.className = 'alert alert-danger';
            status.innerHTML = 'Geolocation is not supported by your browser.';
            return;
        }

        status.className = 'alert alert-info';
        status.innerHTML = 'Getting your location...';

        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                localStorage.setItem('userLat', lat);
                localStorage.setItem('userLon', lon);

                updateLocationDisplay(lat, lon);
                reverseGeocode(lat, lon);

                status.className = 'alert alert-success';
                status.innerHTML = 'Location retrieved successfully!';
            },
            () => {
                status.className = 'alert alert-danger';
                status.innerHTML = 'Unable to retrieve location. Please check your browser permissions.';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    /**
     * Update location display in modal
     */
    function updateLocationDisplay(lat, lon) {
        document.getElementById('currentLat').value = lat.toFixed(6);
        document.getElementById('currentLon').value = lon.toFixed(6);
        userLocation.lat = lat;
        userLocation.lon = lon;
    }

    /**
     * Reverse geocode coordinates to get address
     */
    function reverseGeocode(lat, lon) {
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('locationAddress').value =
                    data.display_name || 'Address not found';
            })
            .catch(() => {
                document.getElementById('locationAddress').value =
                    'Unable to retrieve address';
            });
    }

    /**
     * Auto-refresh parking lots data every 10 seconds
     */
    let autoRefreshInterval = null;

    function startAutoRefresh() {
        console.log('Starting auto-refresh for parking lots...');

        autoRefreshInterval = setInterval(async function() {
            const sort = document.getElementById('sortSelect').value;
            const lat = localStorage.getItem('userLat');
            const lon = localStorage.getItem('userLon');

            // Fetch fresh data
            const data = await fetchData('/api/parking-lots', {
                sort: sort,
                userLat: lat || null,
                userLon: lon || null
            });

            if (!data) return;

            // Get the container for parking lot cards
            const cardsContainer = document.querySelector('.row.g-4');

            // Clear existing cards
            cardsContainer.innerHTML = '';

            // Add each parking lot as a card
            data.parkingLots.forEach(lot => {
                const col = document.createElement('div');
                col.className = 'col-md-5 col-lg-4';

                // Build distance badge if available
                const distanceBadge = lot.distance
                    ? `<span class="badge bg-info text-dark">Distance: ${lot.distance.toFixed(1)} km</span><br>`
                    : '';

                // Build free spots indicator (red if 0)
                const freeSpotClass = lot.freeSpots === 0 ? 'text-danger' : '';

                col.innerHTML = `
                <div class="card shadow-sm card-wrapper"
                     data-bs-toggle="modal"
                     data-bs-target="#billModal"
                     data-lot-id="${lot.id}"
                     data-lot-name="${escapeHtml(lot.name)}"
                     data-lot-price="${lot.price}">
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(lot.name)}</h5>
                        <p class="card-text">
                            <a href="${escapeHtml(lot.location)}" target="_blank"
                               onclick="event.stopPropagation()">
                                ${escapeHtml(lot.location)}
                            </a><br>
                            ${distanceBadge}
                            <strong>Total spots:</strong> ${lot.spots}<br>
                            <span class="${freeSpotClass}">
                                <strong>Free spots:</strong> ${lot.freeSpots}
                            </span><br>
                            <strong>Price:</strong> RON ${parseFloat(lot.price).toFixed(2)}/hr
                        </p>
                        <div class="card-action-btn">
                            <i class="bi bi-calculator-fill" style="font-size: 1.5rem; color: #3a7f3a;"></i>
                        </div>
                    </div>
                </div>
            `;

                cardsContainer.appendChild(col);
            });

            // Re-attach bill modal listeners
            attachBillModalListeners();
        }, 10000); // Refresh every 10 seconds
    }

    function stopAutoRefresh() {
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
            console.log('Auto-refresh stopped');
        }
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

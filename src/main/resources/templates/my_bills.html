<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f3fff3;
            font-family: Arial, sans-serif;
        }
        .page-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .page-header h1 {
            color: #3a7f3a;
            font-weight: bold;
        }
        .card {
            border: 1px solid #b2d8b2;
            border-radius: 12px;
            padding: 10px;
        }
        .card:hover {
            border-color: #3a7f3a;
            box-shadow: 0 6px 20px rgba(58, 127, 58, 0.2);
        }
        .bill-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #2f5f2f;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/parking-lots" class="btn btn-outline-success">
            <i class="bi bi-arrow-left"></i> Back to Parking Lots
        </a>
        <a href="/login" class="btn btn-danger">Logout</a>
    </div>

    <div class="page-header">
        <h1>My Bills</h1>
    </div>

    <div th:if="${#lists.isEmpty(bills)}" class="alert alert-info text-center fs-4 mt-5 shadow-sm">
        <i class="bi bi-emoji-frown"></i> No bills registered yet.
    </div>

    <div class="table-responsive" th:if="${not #lists.isEmpty(bills)}">
        <table class="table table-hover table-bordered">
            <thead class="table-success">
            <tr>
                <th>Location</th>
                <th>Date Issued</th>
                <th>Time Spent (hours)</th>
                <th>Total Paid (RON)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="bill : ${bills}">
                <td th:text="${bill.parkingLotName}"></td>
                <td th:text="${#temporals.format(bill.dateIssued, 'dd-MM-yyyy HH:mm')}"></td>
                <td>
                    <span th:if="${bill.timeSpent != null}" th:text="${bill.timeSpent}"></span>
                    <span th:if="${bill.timeSpent == null}">N/A</span>
                </td>
                <td><strong><span th:text="${#numbers.formatDecimal(bill.moneyAmount, 1, 2)}">0.00</span></strong></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

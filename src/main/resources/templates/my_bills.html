<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f3fff3;
            font-family: Arial, sans-serif;
        }
        .page-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .page-header h1 {
            color: #3a7f3a;
            font-weight: bold;
        }
        .card {
            border: 1px solid #b2d8b2;
            border-radius: 12px;
            padding: 10px;
        }
        .card:hover {
            border-color: #3a7f3a;
            box-shadow: 0 6px 20px rgba(58, 127, 58, 0.2);
        }
        .bill-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #2f5f2f;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/parking-lots" class="btn btn-outline-success">
            <i class="bi bi-arrow-left"></i> Back to Parking Lots
        </a>
        <a href="/login" class="btn btn-danger">Logout</a>
    </div>

    <div class="page-header">
        <h1>My Bills</h1>
    </div>

    <div th:if="${#lists.isEmpty(bills)}" class="alert alert-info text-center fs-4 mt-5 shadow-sm">
        <i class="bi bi-emoji-frown"></i> No bills registered yet.
    </div>

    <div class="row g-4 justify-content-center" th:if="${not #lists.isEmpty(bills)}">
        <div class="col-md-5 col-lg-4" th:each="bill : ${bills}">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h4 class="card-title text-success mb-3">
                        <i class="bi bi-receipt"></i> Parking Receipt
                    </h4>

                    <p class="card-text text-muted mb-1">
                        <strong>Location:</strong> <span th:text="${bill.parkingLotName}"></span>
                    </p>
                    <p class="card-text text-muted mb-3">
                        <strong>Date Issued:</strong> <span th:text="${#temporals.format(bill.dateIssued, 'dd-MM-yyyy HH:mm')}"></span>
                    </p>

                    <div style="background-color: #e8f5e9; border-radius: 6px; padding: 15px;">
                        <p class="mb-0 text-secondary">Total Paid:</p>
                        <div class="bill-amount">RON <span th:text="${#numbers.formatDecimal(bill.moneyAmount, 1, 2)}">0.00</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

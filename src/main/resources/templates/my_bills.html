<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f3fff3;
            font-family: Arial, sans-serif;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        .page-header h1 {
            color: #3a7f3a;
            font-weight: bold;
        }
        .sort-controls {
            background-color: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #b2d8b2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
        }
        .sort-controls label {
            font-weight: 600;
            color: #3a7f3a;
            margin: 0;
            white-space: nowrap;
        }
        .sort-controls select {
            border-color: #b2d8b2;
            min-width: 180px;
        }
        .sort-controls select:focus {
            border-color: #3a7f3a;
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }
        .sort-controls button {
            margin-left: auto;
        }
        .filter-section {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .filter-section label {
            font-weight: 600;
            color: #3a7f3a;
            margin: 0;
            white-space: nowrap;
        }
        .filter-section select {
            border-color: #b2d8b2;
            min-width: 200px;
        }
        .filter-section select:focus {
            border-color: #3a7f3a;
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }
        .clear-filter-btn {
            background-color: #3a7f3a;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .clear-filter-btn:hover {
            background-color: #2f5f2f;
            color: white;
        }
        .no-results-msg {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
        .table thead {
            background-color: #e8f5e9;
        }
        .table-hover tbody tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="top-bar">
        <a href="/parking-lots" class="btn btn-outline-success">
            <i class="bi bi-arrow-left"></i> Back to Parking Lots
        </a>
        <h1 style="color: #3a7f3a; font-weight: bold; margin: 0; flex: 1; text-align: center;">My Bills</h1>
        <a href="/login" class="btn btn-danger">Logout</a>
    </div>

    <div th:if="${#lists.isEmpty(bills)}" class="alert alert-info text-center fs-4 mt-5 shadow-sm">
        <i class="bi bi-emoji-frown"></i> No bills registered yet.
    </div>

    <div th:if="${not #lists.isEmpty(bills)}">
        <!-- Sort Controls with Export Button -->
        <div class="sort-controls">
            <label for="sortSelect">
                <i class="bi bi-funnel"></i> Sort by:
            </label>
            <select id="sortSelect" class="form-select">
                <option value="date" th:selected="${currentSort == 'date'}">
                    Date (Newest First)
                </option>
                <option value="location" th:selected="${currentSort == 'location'}">
                    Parking Lot (A-Z)
                </option>
                <option value="amount" th:selected="${currentSort == 'amount'}">
                    Amount Spent (Highest First)
                </option>
            </select>
            <button id="exportPdfBtn" class="btn btn-primary">
                <i class="bi bi-file-pdf"></i> Export to PDF
            </button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <label for="monthSelect">
                <i class="bi bi-calendar-month"></i> Month:
            </label>
            <select id="monthSelect" class="form-select">
                <option value="">All Months</option>
                <th:block th:each="entry : ${monthlyTotals.entrySet()}">
                    <option th:value="${entry.getKey()}"
                            th:selected="${selectedMonth == entry.getKey()}">
                        <span th:text="${entry.getKey()}"></span> - <span th:text="${#numbers.formatDecimal(entry.getValue(), 1, 2)}"></span> RON
                    </option>
                </th:block>
            </select>

            <label for="daySelect" style="margin-left: 15px;">
                <i class="bi bi-calendar-day"></i> Day:
            </label>
            <select id="daySelect" class="form-select">
                <option value="">All Days</option>
                <th:block th:each="entry : ${dailyTotals.entrySet()}">
                    <option th:value="${entry.getKey()}"
                            th:selected="${selectedDay == entry.getKey()}">
                        <span th:text="${entry.getKey()}"></span> - <span th:text="${#numbers.formatDecimal(entry.getValue(), 1, 2)}"></span> RON
                    </option>
                </th:block>
            </select>

            <th:block th:if="${selectedTotal > 0}">
                <button id="clearFilterBtn" class="clear-filter-btn">
                    <i class="bi bi-x-circle"></i> Clear Filter
                </button>
            </th:block>
        </div>

        <!-- Bills Table -->
        <div class="table-responsive" style="margin-top: 20px;">
            <table class="table table-hover table-bordered">
                <thead class="table-success">
                <tr>
                    <th>
                        <i class="bi bi-geo-alt"></i> Location
                    </th>
                    <th>
                        <i class="bi bi-calendar-event"></i> Date Issued
                    </th>
                    <th>
                        <i class="bi bi-clock"></i> Time Spent (hours)
                    </th>
                    <th>
                        <i class="bi bi-currency-dollar"></i> Total Paid (RON)
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bill : ${bills}">
                    <td th:text="${bill.parkingLotName}"></td>
                    <td th:text="${#temporals.format(bill.dateIssued, 'dd-MM-yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${bill.timeSpent != null}" th:text="${bill.timeSpent}"></span>
                        <span th:if="${bill.timeSpent == null}">N/A</span>
                    </td>
                    <td>
                        <strong><span th:text="${#numbers.formatDecimal(bill.moneyAmount, 1, 2)}">0.00</span></strong>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(bills)}" class="no-results-msg">
            <p>No bills found for the selected period.</p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="/js/ajax-utils.js"></script>

<script>
    /**
     * ========================================
     * MY BILLS PAGE - REAL-TIME UPDATES
     * ========================================
     */

    /**
     * Fetch bills data and update the table
     */
    async function updateBillsTable() {
        const sort = document.getElementById('sortSelect').value || 'date';
        const month = document.getElementById('monthSelect').value || '';
        const day = document.getElementById('daySelect').value || '';

        // Fetch data from API
        const data = await fetchData('/api/bills', {
            sort: sort,
            month: month,
            day: day
        });

        if (!data) {
            showErrorMessage('Failed to load bills. Please try again.');
            return;
        }

        // Get table body
        const tbody = document.querySelector('table tbody');

        // If no bills, show empty message
        if (!data.bills || data.bills.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No bills found for the selected period.</td></tr>';
            return;
        }

        // Clear existing rows
        tbody.innerHTML = '';

        // Add each bill as a table row
        data.bills.forEach(bill => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(bill.parkingLotName)}</td>
                <td>${formatDateTime(bill.dateIssued)}</td>
                <td>
                    ${bill.timeSpent !== null ? bill.timeSpent : 'N/A'}
                </td>
                <td>
                    <strong>${parseFloat(bill.moneyAmount).toFixed(2)}</strong>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    /**
     * Escape HTML special characters for security
     */
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    /**
     * Initialize event listeners on page load
     */
    document.addEventListener('DOMContentLoaded', function() {
        // Sort dropdown listener
        document.getElementById('sortSelect').addEventListener('change', function() {
            updateBillsTable();
        });

        // Month selector listener
        document.getElementById('monthSelect').addEventListener('change', function() {
            if (this.value) {
                // Clear day selection when month is selected
                document.getElementById('daySelect').value = '';
            }
            updateBillsTable();
        });

        // Day selector listener
        document.getElementById('daySelect').addEventListener('change', function() {
            if (this.value) {
                // Clear month selection when day is selected
                document.getElementById('monthSelect').value = '';
            }
            updateBillsTable();
        });

        // Clear filter button
        const clearBtn = document.getElementById('clearFilterBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                document.getElementById('monthSelect').value = '';
                document.getElementById('daySelect').value = '';
                document.getElementById('sortSelect').value = 'date';
                updateBillsTable();
            });
        }

        // Export PDF button
        document.getElementById('exportPdfBtn').addEventListener('click', function() {
            const element = document.querySelector('.table-responsive');
            const opt = {
                margin: 10,
                filename: 'my_bills.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Waiting for Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #f3fff3 0%, #e8f5e9 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container-wrapper {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        .icon {
            font-size: 80px;
            color: #4caf50;
            margin-bottom: 20px;
        }
        h1 {
            color: #2f5f2f;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .logout-btn:hover {
            background-color: #c82333;
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>

<div class="container-wrapper">
    <div class="icon">
        <i class="bi bi-hourglass-split"></i>
    </div>
    <h1>Waiting for Assignment</h1>
    <p>Your account has been created successfully!</p>
    <p>Please wait for the admin to assign you a parking lot. Once assigned, you'll be able to access your parking lot management dashboard.</p>

    <a href="/login" class="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Parking Lot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f3fff3;
            font-family: Arial, sans-serif;
        }
        .main-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-bar {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .top-bar h2 {
            flex: 1;
            text-align: center;
            color: #2f5f2f;
            margin: 0;
            padding-left: 85px;
        }
        .logout-btn {
            width: 85px;
        }
        .form-container {
            max-width: 700px;
            margin: 20px auto 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #b2d8b2;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .form-container h4 {
            text-align: center;
            color: #3a7f3a;
            margin-bottom: 25px;
        }
        h4 {
            color: #3a7f3a;
            margin-top: 30px;
            margin-bottom: 20px;
            text-align: center;
        }
        button {
            background-color: #4caf50;
            border: none;
        }
        button:hover {
            background-color: #449d48;
        }
        .alert {
            max-width: 700px;
            margin: 20px auto;
        }
        .charts-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }
        .chart-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #b2d8b2;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .chart-card h5 {
            color: #3a7f3a;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
        }
        @media (max-width: 1024px) {
            .charts-wrapper {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .chart-container {
                height: 300px;
            }
        }
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
                margin: 20px auto;
            }
            .chart-card {
                padding: 15px;
            }
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>

<body>
<div class="main-wrapper">
    <div class="top-bar">
        <h2>Manage Parking Lot</h2>
        <a href="/login" class="btn btn-danger logout-btn">Logout</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Management Form Section -->
    <div class="form-container">
        <h4>Parking Lot Information</h4>
        <form id="parkingLotForm" th:object="${parkingLot}">
            <input type="hidden" id="parkingLotId" th:value="*{id}"/>
            <input type="hidden" id="managerId" th:value="*{managerId}"/>
            <input type="hidden" id="parkingLotLatitude" th:value="*{latitude}"/>
            <input type="hidden" id="parkingLotLongitude" th:value="*{longitude}"/>
            <input type="hidden" id="parkingLotLocation" th:value="*{location}"/>

            <div class="mb-3">
                <label class="form-label">Parking Lot Name</label>
                <input class="form-control" id="parkingLotName" th:value="*{name}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Total Spots</label>
                <input type="number" min="0" class="form-control" id="parkingLotSpots" th:value="*{spots}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Free Spots</label>
                <input type="number" min="0" class="form-control" id="parkingLotFreeSpots" th:value="*{freeSpots}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price per Hour (RON)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="parkingLotPrice" th:value="*{price}" required>
            </div>

            <button class="btn btn-success w-100 mt-3" type="button" id="updateParkingLotBtn">Update Parking Lot</button>
        </form>
    </div>

    <!-- Statistics Section, NO REFRESH BUTTON NOW -->
    <h4>📊 Parking Statistics</h4>

    <div class="charts-wrapper">
        <!-- Monthly Chart -->
        <div class="chart-card">
            <h5>Monthly Parking Activity (This Year)</h5>
            <div class="chart-container">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- Hourly Chart -->
        <div class="chart-card">
            <h5>Today's Hourly Activity</h5>
            <div class="chart-container">
                <canvas id="hourlyChart"></canvas>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ajax-utils.js"></script>
<script th:inline="javascript">

    let monthlyChart = null;
    let hourlyChart = null;

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];

    const hours = Array.from({length: 24}, (_, i) => i.toString().padStart(2, '0') + ':00');

    document.addEventListener('DOMContentLoaded', function() {
        const monthlyStatsData = /*[[${monthlyStats.values()}]]*/ [];
        const hourlyStatsData = /*[[${hourlyStats.values()}]]*/ [];

        initializeMonthlyChart(monthlyStatsData);
        initializeHourlyChart(hourlyStatsData);

        // Only one button listener remains for updating info
        document.getElementById('updateParkingLotBtn').addEventListener('click', function() {
            updateParkingLot();
        });

        setInterval(refreshStats, 10000); // Auto-poll every 10s (no manual refresh)
    });

    async function updateParkingLot() {
        const button = document.getElementById('updateParkingLotBtn');

        const parkingLotData = {
            id: document.getElementById('parkingLotId').value,
            managerId: document.getElementById('managerId').value,
            name: document.getElementById('parkingLotName').value,
            spots: parseInt(document.getElementById('parkingLotSpots').value),
            freeSpots: parseInt(document.getElementById('parkingLotFreeSpots').value),
            price: parseFloat(document.getElementById('parkingLotPrice').value),
            latitude: document.getElementById('parkingLotLatitude').value,
            longitude: document.getElementById('parkingLotLongitude').value,
            location: document.getElementById('parkingLotLocation').value
        };

        // Validate required fields
        if (!parkingLotData.name) {
            showErrorMessage('Parking lot name is required.');
            return;
        }
        if (isNaN(parkingLotData.spots) || parkingLotData.spots < 0) {
            showErrorMessage('Total spots must be a valid number.');
            return;
        }
        if (isNaN(parkingLotData.freeSpots) || parkingLotData.freeSpots < 0) {
            showErrorMessage('Free spots must be a valid number.');
            return;
        }
        if (parkingLotData.freeSpots > parkingLotData.spots) {
            showErrorMessage('Free spots cannot exceed total spots.');
            return;
        }
        if (isNaN(parkingLotData.price) || parkingLotData.price < 0) {
            showErrorMessage('Price must be a valid number.');
            return;
        }

        setButtonLoading(button, 'Updating...');
        try {
            const response = await fetch('/api/parkinglot', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(parkingLotData)
            });
            const data = await response.json();
            unsetButtonLoading(button);

            if (data.success) {
                showSuccessMessage(data.message);
                if (data.parkingLot) {
                    document.getElementById('parkingLotName').value = data.parkingLot.name;
                    document.getElementById('parkingLotSpots').value = data.parkingLot.spots;
                    document.getElementById('parkingLotFreeSpots').value = data.parkingLot.freeSpots;
                    document.getElementById('parkingLotPrice').value = data.parkingLot.price;
                }
            } else {
                showErrorMessage(data.message || 'Failed to update parking lot.');
            }
        } catch (error) {
            console.error('Error:', error);
            unsetButtonLoading(button);
            showErrorMessage('Failed to connect to the server.');
        }
    }

    function initializeMonthlyChart(data) {
        const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
        monthlyChart = new Chart(monthlyCtx, {
            type: 'line',
            data: {
                labels: monthNames,
                datasets: [{
                    label: 'Parking Sessions',
                    data: data,
                    backgroundColor: 'rgba(76, 175, 80, 0.1)',
                    borderColor: 'rgba(76, 175, 80, 1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: 'rgba(76, 175, 80, 1)',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: {
                        display: true,
                        onClick: null,
                        labels: {
                            font: { size: 12 },
                            color: '#2f5f2f',
                            usePointStyle: true,
                            padding: 15
                        }
                    },
                    tooltip: {
                        enabled: true,
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'rgba(76, 175, 80, 1)',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1, color: '#666' },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    },
                    x: {
                        ticks: { color: '#666' },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function initializeHourlyChart(data) {
        const hourlyCtx = document.getElementById('hourlyChart').getContext('2d');
        hourlyChart = new Chart(hourlyCtx, {
            type: 'bar',
            data: {
                labels: hours,
                datasets: [{
                    label: 'Parking Sessions',
                    data: data,
                    backgroundColor: 'rgba(66, 133, 244, 0.7)',
                    borderColor: 'rgba(66, 133, 244, 1)',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: {
                        display: true,
                        onClick: null,
                        labels: {
                            font: { size: 12 },
                            color: '#2f5f2f',
                            usePointStyle: true,
                            padding: 15
                        }
                    },
                    tooltip: {
                        enabled: true,
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'rgba(66, 133, 244, 1)',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1, color: '#666' },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    },
                    x: {
                        ticks: { color: '#666', font: { size: 10 } },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    /**
     * Refresh statistics by fetching new data from API
     * No UI messages since polling is automatic
     */
    async function refreshStats() {
        const managerId = new URLSearchParams(window.location.search).get('managerId');
        if (!managerId) {
            showErrorMessage('Manager ID not found.');
            return;
        }
        // Fetch fresh stats data
        const data = await fetchData('/api/parkinglot-stats', { managerId: managerId });
        if (!data) {
            showErrorMessage('Failed to refresh statistics. Please try again.');
            return;
        }
        const monthlyData = Object.values(data.monthlyStats);
        const hourlyData = Object.values(data.hourlyStats);

        // Update charts
        if (monthlyChart) {
            monthlyChart.data.datasets[0].data = monthlyData;
            monthlyChart.update();
        }
        if (hourlyChart) {
            hourlyChart.data.datasets[0].data = hourlyData;
            hourlyChart.update();
        }
        // NO success message on auto-update!
    }
</script>

</body>
</html>
